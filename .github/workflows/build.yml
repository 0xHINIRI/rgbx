name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: tweak
          path: |
            packages/*.deb
            .theos/obj/*.dylib
